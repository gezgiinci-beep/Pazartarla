name: Haber taraması gecikme kontrolü — yalnız taslak
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pazartarla-news-schedule-watchdog
  cancel-in-progress: false
jobs:
  recover-overdue-drafts:
    if: github.repository == 'gezgiinci-beep/Pazartarla' && github.ref == 'refs/heads/main' && vars.PAZARTARLA_NEWS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gazette-automation
    steps:
      - name: Kaynağı al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Yedek tarama güvenlik testleri
        run: python -B -m unittest discover -s tests/news -p 'test_schedule_watchdog.py' -v
      - name: Geciken taslak taramasını kontrol et
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/news/schedule_watchdog.py
