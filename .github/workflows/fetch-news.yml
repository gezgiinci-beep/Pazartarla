name: PazarTarla - onay bekleyen haber taslakları
on:
  schedule:
    - cron: '25 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: pazartarla-news-import
  cancel-in-progress: false
jobs:
  prepare-drafts:
    if: github.repository == 'gezgiinci-beep/Pazartarla' && github.ref == 'refs/heads/main' && vars.PAZARTARLA_NEWS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: gazette-automation
    steps:
      - name: Kaynağı al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Çevrimdışı güvenlik ve dönüşüm testleri
        run: python -m unittest discover -s tests/news -v
      - name: Kaynak, metin ve izinli kapak görselinden taslak hazırla
        env:
          PAZARTARLA_NEWS_GEMINI_API_KEY: ${{ secrets.PAZARTARLA_NEWS_GEMINI_API_KEY }}
        run: python fetch_news.py
